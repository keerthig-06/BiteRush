
<!DOCTYPE html>
<html>

<head>

    <title>Order Confirmation</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="page">

        <h1>Order Placed Successfully!</h1>

        <p>Thank you for ordering.</p>

        <h2>Order Details</h2>

        <p>Order ID: <span id="orderId"></span></p>

        <h3>Ordered Items</h3>

        <p id="orderedItems"></p>

        <h3>Customer Details</h3>

        <p>Name: <span id="customerName"></span></p>

        <p>Address: <span id="customerAddress"></span></p>

        <h3>Total Amount: ₹<span id="orderTotal"></span></h3>

        <button onclick="window.location.href='index.html'">
            Back to Food Explore
        </button>

    </div>

    <script>

        let order = JSON.parse(localStorage.getItem("biteRushOrder"));

        if (order) {

            document.getElementById("orderId").textContent =
                order.orderId;

            document.getElementById("orderedItems").textContent =
                order.orderedItems;

            document.getElementById("customerName").textContent =
                order.customerName;

            document.getElementById("customerAddress").textContent =
                order.customerAddress;

            document.getElementById("orderTotal").textContent =
                order.orderTotal;

        }

        else {

            document.querySelector(".page").innerHTML =
                "<h1>No Order Found</h1>" +
                "<p>Please place an order first.</p>" +
                "<button onclick=\"window.location.href='index.html'\">" +
                "Back to Food Explore</button>";

        }

    </script>

</body>

</html>
